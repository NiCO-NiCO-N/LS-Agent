<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ls agent</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235eead4'/%3E%3Ctext x='16' y='21' font-family='Segoe UI,sans-serif' font-size='15' font-weight='700' text-anchor='middle' fill='%2304121a'%3Els%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/static/style.css" />
<link rel="stylesheet" href="/static/style_v2.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">ls</div>
        <div class="brand-text">
          <strong>ls agent</strong>
          <span>Python · 技能可插拔</span>
        </div>
      </div>

      <button class="btn primary block" id="btnNew">＋ 新建对话</button>

      <div class="session-list" id="sessionList"></div>

      <div class="sidebar-foot">
        <button class="btn ghost block" id="btnSkills">
          <span>技能</span><span class="badge" id="skillCount">0</span>
        </button>
        <button class="btn ghost block" id="btnSettings"><span>设置</span><span class="badge" id="providerCount">0</span></button>
        <div class="ws" id="workspaceHint"></div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <div class="title-wrap">
          <h1 id="chatTitle">新对话</h1>
          <div class="meta" id="chatMeta">正在加载…</div>
        </div>
        <div class="topbar-actions">
          <div class="hud" title="本地链路已建立">
            <span class="hud-dot"></span>
            <span>LINK</span>
            <span class="sig"><i></i><i></i><i></i><i></i></span>
          </div>
          <select id="providerSelect" class="select" title="选择模型"></select>
          <button class="icon-btn" id="btnClear" title="清空当前对话">⟳</button>
        </div>
      </header>

      <section class="messages" id="messages">
        <div class="empty" id="emptyState">
          <div class="empty-head">
            <div class="empty-logo">ls</div>
            <div class="empty-titles">
              <div class="empty-eyebrow"><i></i>LOCAL SESSION · READY</div>
              <h2>开始一段对话</h2>
            </div>
          </div>
          <p>接入任意 OpenAI 兼容模型、Claude 或本地 Ollama；勾选技能即可扩展能力。</p>
          <dl class="empty-meta">
            <div><dt>MODEL</dt><dd id="bootModel">—</dd></div>
            <div><dt>TOOLS</dt><dd id="bootTools">—</dd></div>
            <div><dt>SKILLS</dt><dd id="bootSkills">—</dd></div>
          </dl>
          <div class="chips">
            <button class="chip" data-prompt="现在几点了？用工具查一下。"><span class="chip-i">01</span><span class="chip-t">查时间</span><span class="chip-d">演示工具调用</span><span class="chip-go">→</span></button>
            <button class="chip" data-prompt="用 research-brief 技能，帮我做一份关于本地 AI Agent 的调研简报。"><span class="chip-i">02</span><span class="chip-t">用技能做调研</span><span class="chip-d">research-brief</span><span class="chip-go">→</span></button>
            <button class="chip" data-prompt="在 workspace 里写一个 hello.py，然后运行它并把输出告诉我。"><span class="chip-i">03</span><span class="chip-t">写代码并运行</span><span class="chip-d">run_python</span><span class="chip-go">→</span></button>
          </div>
        </div>
      </section>

      <footer class="composer">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送 / Shift+Enter 换行"></textarea>
        <div class="composer-actions">
          <button class="btn danger" id="btnStop" hidden>停止</button>
          <button class="btn primary" id="btnSend">发送</button>
        </div>
      </footer>
    </main>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="modal-card">
      <div class="modal-head">
        <div class="tabs" id="tabs"></div>
        <button class="icon-btn" id="btnCloseModal" title="关闭">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast" id="toast" hidden></div>
  <aside class="rail" id="rail" hidden></aside>
<div class="crt" aria-hidden="true"></div>
  <script src="/static/app.js"></script>

<script>
setTimeout(function () {
  var es = document.getElementById('emptyState');
  if (es) es.hidden = true;
  var box = document.getElementById('messages');
  if (!box || typeof toolCardEl !== 'function') { document.title = 'HOOK_FAIL'; return; }

  var sample = `#!/usr/bin/env python3
"""agent loop"""

import json
from typing import Any, AsyncIterator

from . import llm, storage, tools
from .config import load_config

MAX_STEPS = 8
TOOL_RESULT_LIMIT = 12000

async def run_turn(session_id: str, message: str, provider_id=None) -> AsyncIterator[dict]:
    session = storage.load_session(session_id)
    session["messages"].append({"role": "user", "content": message})
    for step in range(MAX_STEPS):
        reply = await llm.astream(session, provider_id)
        if reply.get("tool_calls"):
            for call in reply["tool_calls"]:
                result = await tools.execute_tool(call)
                yield {"type": "tool_result", "id": call["id"], "result": result}
        else:
            yield {"type": "assistant", "message": reply}
            break`;

  var w = document.createElement('div');
  w.className = 'msg assistant';
  w.innerHTML = '<div class="bubble"><div class="tools"></div><div class="content"><p>读完了，前十几行是导入与配置常量。</p></div></div>';
  var card = toolCardEl('read_file', { path: 'app/agent.py', max_bytes: 20000, offset: 0 }, { ok: true, content: sample });
  card.open = true;
  w.querySelector('.tools').appendChild(card);
  box.appendChild(w);

  var w2 = document.createElement('div');
  w2.className = 'msg assistant';
  w2.innerHTML = '<div class="bubble"><div class="tools"></div><div class="content"><p>这段代码跑不起来，语法错误在第 2 行。</p></div></div>';
  var c2 = toolCardEl('run_python', { code: 'print(1)\nfor x in range(: 2)' },
    { ok: false, content: 'Traceback (most recent call last):\n  File "<string>", line 2\n    for x in range(: 2)\n                     ^\nSyntaxError: invalid syntax' });
  c2.open = true;
  w2.querySelector('.tools').appendChild(c2);
  box.appendChild(w2);
}, 2600);
</script>
</body>
</html>
